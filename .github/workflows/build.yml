name: Build and Test

on:
  push:
    branches:
      - questions_reviews
  pull_request:
    branches:
      - questions_reviews

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: exambank_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exambank_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/exambank_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci-postgres-password
      OPENAI_API_KEY: ci-test-key
      APP_AUTH_USERNAME: ci-expert
      APP_AUTH_PASSWORD: ci-auth-password
      APP_VERIFICATION_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean test
