name: Final dropdown repair
on:
  push:
    branches:
      - ui/redesign-professional
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Add final dropdown repair workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dropdown implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/resources/static/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function createSearchableSelect(')
          end = s.index('function initializeEducationControls(', start)
          replacement = r'''function createSearchableSelect(containerId, hiddenId, options, initialValue, multiple=false){
            const container=document.getElementById(containerId);
            const hidden=document.getElementById(hiddenId);
            if(!container || !hidden) return;
            const normalized=(Array.isArray(options)?options:[]).map((o,i)=>({
              label:String(o?.label ?? o?.name ?? o?.title ?? o?.subject ?? o?.value ?? `Option ${i+1}`),
              value:String(o?.value ?? o?.code ?? o?.id ?? o?.name ?? o?.label ?? `option_${i+1}`)
            })).slice(0,10);
            const initial=String(hidden.value || initialValue || '').split(',').map(v=>v.trim()).filter(Boolean);
            const selected=new Set(initial);
            container.innerHTML=`
              <div class="relative" data-dropdown-root>
                <button type="button" data-dropdown-trigger aria-haspopup="listbox" aria-expanded="false" class="field flex min-h-[46px] w-full items-center justify-between gap-3 rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-3 text-left text-sm outline-none hover:bg-white focus:border-indigo-500 focus:bg-white">
                  <span data-dropdown-label class="min-w-0 truncate font-semibold text-slate-800"></span>
                  <span class="shrink-0 text-slate-400">⌄</span>
                </button>
                <div data-dropdown-menu class="absolute left-0 right-0 z-[100] mt-2 hidden overflow-hidden rounded-2xl border border-slate-200 bg-white p-2 shadow-2xl">
                  <div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                    <span class="text-slate-400">⌕</span>
                    <input data-dropdown-search type="search" placeholder="Search..." autocomplete="off" class="w-full bg-transparent text-sm outline-none">
                  </div>
                  <div data-dropdown-options class="search-dropdown mt-2 space-y-1" role="listbox"></div>
                </div>
              </div>`;
            const root=container.querySelector('[data-dropdown-root]');
            const trigger=container.querySelector('[data-dropdown-trigger]');
            const menu=container.querySelector('[data-dropdown-menu]');
            const search=container.querySelector('[data-dropdown-search]');
            const list=container.querySelector('[data-dropdown-options]');
            const label=container.querySelector('[data-dropdown-label]');
            let query='';
            function esc(value){return escapeHtml(value);}
            function updateLabel(){
              const chosen=normalized.filter(o=>selected.has(o.value));
              if(multiple) label.textContent=chosen.length?chosen.map(o=>o.label).join(', '):'Select target levels';
              else label.textContent=chosen[0]?.label || 'Select an option';
              hidden.value=[...selected].join(',');
            }
            function renderOptions(){
              const q=query.trim().toLowerCase();
              const filtered=normalized.filter(o=>o.label.toLowerCase().includes(q)||o.value.toLowerCase().includes(q));
              list.innerHTML=filtered.length ? filtered.map(o=>{
                const checked=selected.has(o.value);
                return `<button type="button" data-option-value="${esc(o.value)}" class="search-option flex w-full items-center justify-between rounded-xl px-3 py-3 text-left text-xs font-bold ${checked?'bg-indigo-50 text-indigo-700':'text-slate-700'}"><span>${esc(o.label)}</span><span class="text-indigo-600">${checked?'✓':''}</span></button>`;
              }).join('') : '<div class="px-3 py-4 text-center text-xs font-semibold text-slate-400">No matching option</div>';
              list.querySelectorAll('[data-option-value]').forEach(option=>option.addEventListener('click',function(e){
                e.preventDefault();
                e.stopPropagation();
                const value=this.dataset.optionValue;
                if(multiple){
                  if(selected.has(value)) selected.delete(value); else selected.add(value);
                  query='';
                  search.value='';
                  updateLabel();
                  renderOptions();
                  search.focus();
                }else{
                  selected.clear();
                  selected.add(value);
                  query='';
                  search.value='';
                  updateLabel();
                  close();
                }
              }));
            }
            function open(){
              document.querySelectorAll('[data-searchable-select]').forEach(other=>{
                if(other!==container){
                  const otherMenu=other.querySelector('[data-dropdown-menu]');
                  const otherTrigger=other.querySelector('[data-dropdown-trigger]');
                  if(otherMenu) otherMenu.classList.add('hidden');
                  if(otherTrigger) otherTrigger.setAttribute('aria-expanded','false');
                }
              });
              menu.classList.remove('hidden');
              trigger.setAttribute('aria-expanded','true');
              renderOptions();
              setTimeout(()=>search.focus(),0);
            }
            function close(){
              menu.classList.add('hidden');
              trigger.setAttribute('aria-expanded','false');
            }
            trigger.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();menu.classList.contains('hidden')?open():close();});
            menu.addEventListener('click',e=>e.stopPropagation());
            search.addEventListener('input',function(){query=this.value;renderOptions();});
            search.addEventListener('keydown',function(e){if(e.key==='Escape'){close();trigger.focus();}});
            container.dataset.searchableSelect='true';
            updateLabel();
            renderOptions();
          }

          '''
          s = s[:start] + replacement + s[end:]
          start = s.index('function initializeEducationControls(')
          end = s.index('function addSectionRow(', start)
          replacement = r'''function initializeEducationControls(subjects, levels){
            createSearchableSelect('ingestSubjectSelect','ingestSubject',subjects,'chemistry');
            createSearchableSelect('ingestLevelSelect','ingestLevel',levels,'CLASS_11');
            createSearchableSelect('blueprintSubjectSelect','blueprintSubject',subjects,'chemistry');
            createSearchableSelect('blueprintLevelsSelect','blueprintLevels',levels,'CLASS_11',true);
          }

          async function loadEducationOptions(){
            const subjects=fallbackOptions.subjects.slice(0,10);
            const levels=fallbackOptions.targetLevels.slice(0,10);
            initializeEducationControls(subjects,levels);
            try{
              const res=await fetch('/education-options.json',{cache:'no-store'});
              if(!res.ok) throw new Error('Options request failed');
              const data=await res.json();
              const loadedSubjects=(Array.isArray(data.subjects)?data.subjects:[]).slice(0,10);
              const loadedLevels=(Array.isArray(data.targetLevels)?data.targetLevels:[]).slice(0,10);
              if(loadedSubjects.length===10 && loadedLevels.length===10) initializeEducationControls(loadedSubjects,loadedLevels);
            }catch(err){console.warn('Using built-in education options',err);}
          }

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove repair workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-dropdown-final.yml
          git add src/main/resources/static/index.html .github/workflows/fix-dropdown-final.yml
          git commit -m 'Fix searchable subject and target level dropdowns'
          git push
