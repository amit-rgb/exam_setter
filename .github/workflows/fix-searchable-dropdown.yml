name: Fix searchable dropdowns

on:
  push:
    branches:
      - ui/redesign-professional

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix searchable subject and target level dropdowns') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dropdown implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p = Path('src/main/resources/static/index.html')
          s = p.read_text()
          start = s.index('function createSearchableSelect(')
          end = s.index('\n\nasync function loadEducationOptions()', start)
          replacement = r'''function createSearchableSelect(containerId, hiddenId, options, initialValue, multiple=false) {
  const container = document.getElementById(containerId);
  const hidden = document.getElementById(hiddenId);
  if (!container || !hidden) return;

  const initial = (hidden.value || initialValue || '').split(',').map(v => v.trim()).filter(Boolean);
  const state = { open: false, query: '', selected: new Set(initial) };

  function render() {
    const selected = options.filter(o => state.selected.has(o.value));
    const label = multiple
      ? (selected.length ? selected.map(o => o.label).join(', ') : 'Select target levels')
      : (selected[0]?.label || 'Select an option');

    container.innerHTML = `
      <div class="relative">
        <button type="button" data-select-trigger aria-haspopup="listbox" aria-expanded="${state.open}"
          class="field flex min-h-[46px] w-full items-center justify-between gap-3 rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-3 text-left text-sm outline-none hover:bg-white focus:border-indigo-500 focus:bg-white">
          <span class="min-w-0 truncate font-semibold ${selected.length ? 'text-slate-800' : 'text-slate-400'}">${escapeHtml(label)}</span>
          <span class="text-slate-400">⌄</span>
        </button>
        ${state.open ? `
          <div data-dropdown class="absolute left-0 right-0 z-[100] mt-2 overflow-hidden rounded-2xl border border-slate-200 bg-white p-2 shadow-2xl">
            <div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
              <span class="text-slate-400">⌕</span>
              <input data-search type="search" value="${escapeHtml(state.query)}" placeholder="Search..."
                autocomplete="off" class="w-full bg-transparent text-sm outline-none" />
            </div>
            <div data-options class="search-dropdown mt-2 space-y-1" role="listbox"></div>
          </div>` : ''}
      </div>`;

    const trigger = container.querySelector('[data-select-trigger]');
    trigger.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      state.open = !state.open;
      render();
      if (state.open) focusSearch();
    });

    if (!state.open) return;

    const dropdown = container.querySelector('[data-dropdown]');
    dropdown.addEventListener('click', e => e.stopPropagation());

    const search = container.querySelector('[data-search]');
    search.addEventListener('input', () => {
      state.query = search.value;
      renderOptions();
      const current = container.querySelector('[data-search]');
      current.focus();
      current.setSelectionRange(current.value.length, current.value.length);
    });
    search.addEventListener('keydown', e => {
      if (e.key === 'Escape') { state.open = false; render(); }
    });

    renderOptions();
    focusSearch();

    function renderOptions() {
      const list = container.querySelector('[data-options]');
      const q = state.query.trim().toLowerCase();
      const filtered = options.filter(o => o.label.toLowerCase().includes(q) || o.value.toLowerCase().includes(q));
      list.innerHTML = filtered.length ? filtered.map(o => {
        const checked = state.selected.has(o.value);
        return `<button type="button" data-value="${escapeHtml(o.value)}"
          class="search-option flex w-full items-center justify-between rounded-xl px-3 py-3 text-left text-xs font-bold ${checked ? 'bg-indigo-50 text-indigo-700' : 'text-slate-700 hover:bg-indigo-50'}">
          <span>${escapeHtml(o.label)}</span><span class="text-indigo-600">${checked ? '✓' : ''}</span>
        </button>`;
      }).join('') : '<div class="px-3 py-4 text-center text-xs font-semibold text-slate-400">No matching option</div>';

      list.querySelectorAll('[data-value]').forEach(option => option.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const value = option.dataset.value;
        if (multiple) {
          if (state.selected.has(value)) state.selected.delete(value); else state.selected.add(value);
          hidden.value = Array.from(state.selected).join(',');
          state.query = '';
          render();
          focusSearch();
        } else {
          state.selected = new Set([value]);
          hidden.value = value;
          state.query = '';
          state.open = false;
          render();
        }
      }));
    }

    function focusSearch() {
      const input = container.querySelector('[data-search]');
      if (input) setTimeout(() => input.focus(), 0);
    }
  }

  render();
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          data = {
            'sources': ['https://cbseacademic.nic.in/'],
            'subjects': [
              {'label':'English','value':'english'}, {'label':'Hindi','value':'hindi'},
              {'label':'Mathematics','value':'mathematics'}, {'label':'Physics','value':'physics'},
              {'label':'Chemistry','value':'chemistry'}, {'label':'Biology','value':'biology'},
              {'label':'Science','value':'science'}, {'label':'Computer Science','value':'computer_science'},
              {'label':'Social Science','value':'social_science'}, {'label':'Economics','value':'economics'}
            ],
            'targetLevels': [
              {'label':'Class 3','value':'CLASS_3'}, {'label':'Class 4','value':'CLASS_4'},
              {'label':'Class 5','value':'CLASS_5'}, {'label':'Class 6','value':'CLASS_6'},
              {'label':'Class 7','value':'CLASS_7'}, {'label':'Class 8','value':'CLASS_8'},
              {'label':'Class 9','value':'CLASS_9'}, {'label':'Class 10','value':'CLASS_10'},
              {'label':'Class 11','value':'CLASS_11'}, {'label':'Class 12','value':'CLASS_12'}
            ]
          }
          Path('src/main/resources/static/education-options.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/static/index.html src/main/resources/static/education-options.json
          git commit -m 'Fix searchable subject and target level dropdowns'
          git push
