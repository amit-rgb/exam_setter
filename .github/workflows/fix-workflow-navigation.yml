name: Fix workflow navigation
on:
  push:
    branches: [ui/redesign-professional]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/redesign-professional
          fetch-depth: 0
      - name: Patch workflow navigation
        shell: python
        run: |
          from pathlib import Path
          files = ['index.html','blueprint.html','review.html']
          base = Path('src/main/resources/static')
          for name in files:
              p = base / name
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="index.html"', 'href="index.html" onclick="return navigateWorkflow(\'index.html\')"')
              s = s.replace('href="blueprint.html"', 'href="blueprint.html" onclick="return navigateWorkflow(\'blueprint.html\')"')
              s = s.replace('href="review.html"', 'href="review.html" onclick="return navigateWorkflow(\'review.html\')"')
              p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-workflow-navigation.yml
      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/static/index.html src/main/resources/static/blueprint.html src/main/resources/static/review.html .github/workflows/fix-workflow-navigation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix three-step workflow navigation"
          git push origin ui/redesign-professional
