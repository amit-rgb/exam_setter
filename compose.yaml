services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?APP_AUTH_USERNAME must be set}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?APP_AUTH_PASSWORD must be set}
      APP_VERIFICATION_ENABLED: "false"
      JPA_DDL_AUTO: "${JPA_DDL_AUTO:-update}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  ncert-ingest:
    build:
      context: .
    profiles: ["ncert"]
    restart: "no"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?APP_AUTH_USERNAME must be set}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?APP_AUTH_PASSWORD must be set}
      APP_VERIFICATION_ENABLED: "false"
      JPA_DDL_AUTO: "${JPA_DDL_AUTO:-update}"
      NCERT_INGESTION_ENABLED: "true"
      NCERT_CORPUS_ROOT: /app/NCERT
      NCERT_CORPUS_MANIFEST: /app/NCERT/manifest.json
      NCERT_CORPUS_VERSION: ${NCERT_CORPUS_VERSION:-2026}
      NCERT_CHUNK_VERSION: ${NCERT_CHUNK_VERSION:-v1}
      NCERT_CHUNK_SIZE: ${NCERT_CHUNK_SIZE:-500}
      NCERT_CHUNK_OVERLAP: ${NCERT_CHUNK_OVERLAP:-80}
      NCERT_INGESTION_BATCH_SIZE: ${NCERT_INGESTION_BATCH_SIZE:-50}
      NCERT_INGESTION_FAIL_FAST: ${NCERT_INGESTION_FAIL_FAST:-false}
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    volumes:
      - ./NCERT:/app/NCERT:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
