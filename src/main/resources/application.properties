spring.application.name=exam-paper-setter

# Production RAG / ingestion
spring.ai.openai.embedding.metadata-mode=EMBED
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=50

app.ingestion.pipeline-version=v2
app.ingestion.chunk-version=v2
app.ingestion.chunk-size-chars=2400
app.ingestion.chunk-overlap-chars=400

# NCERT structural chunking
app.ncert.ingestion.chunk-version=v2
app.ncert.ingestion.chunk-size=500
app.ncert.ingestion.chunk-overlap=80
