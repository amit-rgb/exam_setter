<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assessment Studio · Document Content</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header class="app-header sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 md:px-6">
    <a href="dashboard.html" class="flex items-center gap-3 rounded-2xl">
      <div class="brand-mark flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-950 text-xl">📝</div>
      <div><div class="text-base font-extrabold tracking-tight md:text-lg">Assessment Studio</div><div class="text-[11px] font-medium text-slate-500">AI Assessment Authoring Platform</div></div>
    </a>
    <a href="dashboard.html" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">← Dashboard</a>
  </div>
</header>
<main class="mx-auto max-w-5xl px-4 py-8 md:px-6 md:py-12">
  <div id="alertBox" class="mb-6 hidden rounded-2xl border px-4 py-3 text-sm font-semibold"></div>
  <section class="mb-8">
    <div class="mb-3 inline-flex rounded-full border border-indigo-200 bg-indigo-50 px-3 py-1 text-[11px] font-black uppercase text-indigo-700">Indexed content</div>
    <h1 id="fileName" class="break-words text-3xl font-black tracking-tight md:text-5xl">Loading…</h1>
    <p id="meta" class="mt-3 text-sm text-slate-500"></p>
  </section>
  <section id="chunks" class="space-y-5"></section>
</main>
<script>
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
const alertBox=(msg)=>{const b=document.getElementById('alertBox');b.textContent=msg;b.className='mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700';b.classList.remove('hidden')};
const key=new URLSearchParams(location.search).get('documentKey');
async function load(){
  if(!key){alertBox('No document was selected.');return}
  try{
    const r=await fetch('/api/dashboard/ingested-documents/content?documentKey='+encodeURIComponent(key));
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.message||d.error||'Unable to load document content.');
    const chunks=Array.isArray(d.chunks)?d.chunks:[];
    document.getElementById('fileName').textContent=chunks[0]?.fileName||key;
    document.getElementById('meta').textContent=(d.chunkCount||0)+' indexed chunk'+(d.chunkCount===1?'':'s')+(chunks[0]?.sourceType?' · '+chunks[0].sourceType:'');
    document.getElementById('chunks').innerHTML=chunks.length?chunks.map((c,i)=>'<article class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm"><div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 bg-slate-50 px-5 py-3"><span class="text-xs font-black uppercase tracking-wider text-slate-500">Chunk '+esc(c.chunkIndex||i+1)+'</span><span class="text-[11px] font-semibold text-slate-500">'+(c.pageNumber?'Page '+esc(c.pageNumber):'')+'</span></div><div class="whitespace-pre-wrap break-words px-5 py-6 text-sm leading-7 text-slate-700">'+esc(c.content||'')+'</div></article>').join(''):'<div class="rounded-3xl border border-amber-200 bg-amber-50 p-8 text-sm text-amber-800">No indexed content was found for this document.</div>';
  }catch(e){alertBox(e.message)}
}
load();
</script>
</body>
</html>
